  cameraTest:
    image: camera:test
    build:
      context: ..
      dockerfile: dockerfiles/cameraTest.dockerfile
    stdin_open: true                # equivalent to -i
    tty: true                       # equivalent to -t
    environment:
      - DISPLAY=${DISPLAY}
      - QT_X11_NO_MITSHM=1
    volumes:
      - /tmp/.X11-unix:/tmp/.X11-unix  # X11 socket
      - /run/udev:/run/udev:ro
    privileged: true
    network_mode: host

  cameraROS:
    image: camera:ros
    build:
      context: ..
      dockerfile: dockerfiles/cameraRos.dockerfile
    stdin_open: true                # equivalent to -i
    tty: true                       # equivalent to -t
    environment:
      - DISPLAY=${DISPLAY}
      - QT_X11_NO_MITSHM=1
    volumes:
      - /tmp/.X11-unix:/tmp/.X11-unix  # X11 socket
      - /run/udev:/run/udev:ro
    privileged: true
    network_mode: host
