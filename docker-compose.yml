  cameraROS:
    image: camera:ros
    build:
      context: .
      dockerfile: dockerfiles/cameraRos.dockerfile
    container_name: camera_ros
    stdin_open: true                # equivalent to -i
    tty: true                       # equivalent to -t
    environment:
      - DISPLAY=${DISPLAY}
      - QT_X11_NO_MITSHM=1
    volumes:
      - /tmp/.X11-unix:/tmp/.X11-unix  # X11 socket
      - /run/udev:/run/udev:ro
      - ./libs/filters:/ros_ws/src/filters
    privileged: true
    network_mode: host
  
