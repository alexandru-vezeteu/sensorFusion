  sensor_fusion:
    image: sensor_fusion:v1
    build:
      context: .
      dockerfile: dockerfiles/all.dockerfile
    container_name: sensor_fusion
    stdin_open: true
    tty: true
    environment:
      - DISPLAY=:0
      - QT_X11_NO_MITSHM=1
      - ROS_LOCALHOST_ONLY=0
      - ROS_DOMAIN_ID=5
    volumes:
      - /tmp/.X11-unix:/tmp/.X11-unix
      - /run/udev:/run/udev:ro
      - /dev/rplidar:/dev/rplidar
    network_mode: host
    privileged: true


  
